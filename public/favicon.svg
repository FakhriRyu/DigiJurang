<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="dj-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FBBF24" />
      <stop offset="50%" stopColor="#F59E0B" />
      <stop offset="100%" stopColor="#EA580C" />
    </linearGradient>

    <!-- Straw Blue Gradient (Ratusan) -->
    <linearGradient id="dj-straw-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#38BDF8" />
      <stop offset="50%" stopColor="#0EA5E9" />
      <stop offset="100%" stopColor="#0284C7" />
    </linearGradient>

    <!-- Straw Yellow Gradient (Puluhan) -->
    <linearGradient id="dj-straw-yellow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#FDE047" />
      <stop offset="50%" stopColor="#FACC15" />
      <stop offset="100%" stopColor="#EAB308" />
    </linearGradient>

    <!-- Straw Coral/Red Gradient (Satuan) -->
    <linearGradient id="dj-straw-red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#F87171" />
      <stop offset="50%" stopColor="#EF4444" />
      <stop offset="100%" stopColor="#DC2626" />
    </linearGradient>

    <!-- Pocket Gradient -->
    <linearGradient id="dj-pocket-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#0284C7" />
      <stop offset="100%" stopColor="#0369A1" />
    </linearGradient>

    <!-- Heart Gradient -->
    <linearGradient id="dj-heart-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FB7185" />
      <stop offset="100%" stopColor="#E11D48" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dj-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" floodColor="#000000" floodOpacity="0.25" />
    </filter>
    <filter id="dj-soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Main Squircle Base Badge -->
  <rect
    x="4"
    y="4"
    width="92"
    height="92"
    rx="26"
    fill="url(#dj-bg-grad)"
    filter="url(#dj-shadow)"
  />

  <!-- Inner Highlight Ring -->
  <rect
    x="6"
    y="6"
    width="88"
    height="88"
    rx="24"
    fill="none"
    stroke="#FFFFFF"
    strokeWidth="2"
    strokeOpacity="0.35"
  />

  <!-- Decorative Golden Star Sparkle Top Right -->
  <path
    d="M 80 18 Q 80 26 88 26 Q 80 26 80 34 Q 80 26 72 26 Q 80 26 80 18 Z"
    fill="#FEF08A"
    filter="url(#dj-soft-glow)"
  />
  <circle cx="71" cy="16" r="2" fill="#FFFFFF" opacity="0.8" />

  <!-- Floating Math Sparkle Top Left (+) -->
  <g opacity="0.85">
    <path d="M 22 17 L 22 25 M 18 21 L 26 21" stroke="#FFFFFF" strokeWidth="2.5" strokeLinecap="round" />
  </g>

  <!-- 2. Three Place-Value Straws (Blue, Yellow, Red) -->
  <!-- Straw 1: Blue (Ratusan) - Left tilted -->
  <g transform="rotate(-12 34 50)">
    <rect x="29" y="18" width="10" height="46" rx="5" fill="url(#dj-straw-blue)" filter="url(#dj-shadow)" />
    <!-- Straw Stripes -->
    <line x1="29" y1="26" x2="39" y2="30" stroke="#FFFFFF" strokeWidth="2.5" strokeLinecap="round" opacity="0.85" />
    <line x1="29" y1="36" x2="39" y2="40" stroke="#FFFFFF" strokeWidth="2.5" strokeLinecap="round" opacity="0.85" />
    <line x1="29" y1="46" x2="39" y2="50" stroke="#FFFFFF" strokeWidth="2.5" strokeLinecap="round" opacity="0.85" />
    <!-- Bendy Ribs -->
    <line x1="29" y1="22" x2="39" y2="22" stroke="#0369A1" strokeWidth="1" opacity="0.6" />
    <line x1="29" y1="24" x2="39" y2="24" stroke="#0369A1" strokeWidth="1" opacity="0.6" />
  </g>

  <!-- Straw 2: Yellow (Puluhan) - Center taller -->
  <g transform="translate(0, 0)">
    <rect x="45" y="14" width="10" height="50" rx="5" fill="url(#dj-straw-yellow)" filter="url(#dj-shadow)" />
    <!-- Straw Stripes -->
    <line x1="45" y1="22" x2="55" y2="26" stroke="#FFFFFF" strokeWidth="2.5" strokeLinecap="round" opacity="0.9" />
    <line x1="45" y1="32" x2="55" y2="36" stroke="#FFFFFF" strokeWidth="2.5" strokeLinecap="round" opacity="0.9" />
    <line x1="45" y1="42" x2="55" y2="46" stroke="#FFFFFF" strokeWidth="2.5" strokeLinecap="round" opacity="0.9" />
    <!-- Bendy Ribs -->
    <line x1="45" y1="18" x2="55" y2="18" stroke="#CA8A04" strokeWidth="1" opacity="0.6" />
    <line x1="45" y1="20" x2="55" y2="20" stroke="#CA8A04" strokeWidth="1" opacity="0.6" />
  </g>

  <!-- Straw 3: Coral/Red (Satuan) - Right tilted -->
  <g transform="rotate(12 66 50)">
    <rect x="61" y="20" width="10" height="44" rx="5" fill="url(#dj-straw-red)" filter="url(#dj-shadow)" />
    <!-- Straw Stripes -->
    <line x1="61" y1="28" x2="71" y2="32" stroke="#FFFFFF" strokeWidth="2.5" strokeLinecap="round" opacity="0.85" />
    <line x1="61" y1="38" x2="71" y2="42" stroke="#FFFFFF" strokeWidth="2.5" strokeLinecap="round" opacity="0.85" />
    <line x1="61" y1="48" x2="71" y2="52" stroke="#FFFFFF" strokeWidth="2.5" strokeLinecap="round" opacity="0.85" />
    <!-- Bendy Ribs -->
    <line x1="61" y1="24" x2="71" y2="24" stroke="#B91C1C" strokeWidth="1" opacity="0.6" />
    <line x1="61" y1="26" x2="71" y2="26" stroke="#B91C1C" strokeWidth="1" opacity="0.6" />
  </g>

  <!-- 3. Iconic Place-Value Denim Pocket -->
  <g filter="url(#dj-shadow)">
    <!-- Pocket Body Polygon -->
    <path
      d="M 22 50 L 78 50 L 78 76 L 50 88 L 22 76 Z"
      fill="url(#dj-pocket-grad)"
    />

    <!-- Pocket Rim Top -->
    <path
      d="M 20 48 L 80 48 Q 80 52 78 54 L 22 54 Q 20 52 20 48 Z"
      fill="#0284C7"
    />

    <!-- White Dashed Stitching Line -->
    <path
      d="M 26 53 L 74 53 L 74 74 L 50 84 L 26 74 Z"
      fill="none"
      stroke="#FFFFFF"
      strokeWidth="1.5"
      strokeDasharray="3 2"
      opacity="0.9"
    />

    <!-- Center Heart Emblem -->
    <path
      d="M 50 78 C 50 78 37 70 37 63 C 37 58.5 40.5 55 45 55 C 47.5 55 49.2 56.5 50 57.8 C 50.8 56.5 52.5 55 55 55 C 59.5 55 63 58.5 63 63 C 63 70 50 78 50 78 Z"
      fill="url(#dj-heart-grad)"
      stroke="#FFFFFF"
      strokeWidth="1.5"
    />

    <!-- Heart Gloss Shine -->
    <ellipse cx="43.5" cy="60" rx="2" ry="3" transform="rotate(-25 43.5 60)" fill="#FFFFFF" opacity="0.6" />
  </g>
</svg>